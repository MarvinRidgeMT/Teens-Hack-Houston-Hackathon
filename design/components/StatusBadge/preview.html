<!-- @dsCard group="Status" height=110 subtitle="Click to replay the state pops" -->
<div class="pk" id="row" style="padding:20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--paper);font:400 12px/16px var(--font-sans);color:var(--ink-body);cursor:pointer">
  <span style="display:flex;gap:6px;align-items:center"><span class="pk-badge pk-badge--parked" aria-hidden="true">P</span>Parked</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="pk-badge pk-badge--away" id="away" aria-hidden="true">•</span>Away</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="pk-badge pk-badge--wrapped" aria-hidden="true">☾</span>Wrapped up</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="pk-badge pk-badge--saved" aria-hidden="true">✓</span>Saved</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="pk-badge pk-badge--neutral" aria-hidden="true">?</span>No task yet</span>
</div>
<script>
const M = window.Motion || {};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const go = (el, k, o) => (M.animate && !reduce ? M.animate(el, k, o) : Promise.resolve());
const OUT = [0.22, 1, 0.36, 1], IN = [0.4, 0, 1, 1];
const badges = document.querySelectorAll(".pk-badge");
const pop = () => go(badges, { scale: [0.6, 1], opacity: [0, 1] }, { type: "spring", bounce: 0.45, duration: 0.45, delay: M.stagger ? M.stagger(0.06) : 0 });
pop();
go(document.getElementById("away"), { opacity: [1, 0.55, 1] }, { duration: 2.4, repeat: Infinity, ease: "easeInOut" });
document.getElementById("row").addEventListener("click", pop);
</script>
