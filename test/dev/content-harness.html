<body style="font:16px Georgia;margin:40px">
<h1>Harness</h1><p id="t">Droughts in the region have grown longer over the past two decades.</p>
<div style="height:4000px"></div>
<script>
  // fake chrome.runtime: records what content.js sends, lets the test deliver engine messages
  window.sent = [];
  let listener = null;
  window.chrome = { runtime: {
    sendMessage(m, cb) { sent.push(m); cb && cb(); },
    onMessage: { addListener(fn) { listener = fn; } },
    lastError: undefined,
  }};
  window.engine = (msg) => new Promise((res) => { let replied = null; listener(msg, {}, (r) => { replied = r; }); res(replied); });
</script>
