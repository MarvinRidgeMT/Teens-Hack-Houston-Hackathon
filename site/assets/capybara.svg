<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" role="img" aria-labelledby="capyTitle" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="capyTitle">Pickup's capybara, holding a bookmark so you don't lose your place</title>
  <!-- Original drawing for Pickup (Triple H 2026). Colours follow the site tokens. -->
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C08B63"/>
      <stop offset="1" stop-color="#A4734F"/>
    </linearGradient>
    <linearGradient id="furHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9966D"/>
      <stop offset="1" stop-color="#AD7A54"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="128" cy="194" rx="92" ry="9" fill="#302545" opacity=".12"/>

  <!-- back leg -->
  <rect x="58" y="158" width="26" height="34" rx="11" fill="#966645"/>
  <!-- body -->
  <path d="M40 140c0-36 34-62 84-62 34 0 58 10 70 28 8 12 8 30 4 44-6 22-30 36-74 36-52 0-84-16-84-46z" fill="url(#fur)"/>
  <!-- belly light -->
  <path d="M70 168c20 10 70 12 100 2" fill="none" stroke="#D9AE87" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <!-- front leg -->
  <rect x="150" y="160" width="24" height="33" rx="10" fill="#9E6C49"/>

  <!-- head -->
  <path d="M140 96c0-24 18-40 44-40h12c22 0 38 16 38 38v20c0 18-14 30-32 30h-26c-20 0-36-14-36-32z" fill="url(#furHead)"/>
  <!-- ear -->
  <ellipse cx="160" cy="62" rx="11" ry="9" fill="#8E5E3F"/>
  <ellipse cx="160" cy="63" rx="5.5" ry="4.5" fill="#6F452C" opacity=".6"/>
  <!-- snout -->
  <path d="M206 84h10c12 0 20 8 20 20v8c0 12-9 20-21 20h-11z" fill="#8E5E3F"/>
  <path d="M229 95c2 1 3 3 3 5" fill="none" stroke="#5A3A26" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M214 120c4 3 9 3 13 0" fill="none" stroke="#302545" stroke-width="2.4" stroke-linecap="round"/>
  <!-- eye (calm, half-closed: content) -->
  <path d="M180 86c3 3 9 3 12 0" fill="none" stroke="#302545" stroke-width="3.2" stroke-linecap="round"/>
  <!-- cheek -->
  <ellipse cx="190" cy="108" rx="9" ry="6" fill="#FFBFD8" opacity=".75"/>

  <!-- bookmark ribbon held in the mouth -->
  <path d="M214 122h18v46l-9-8-9 8z" fill="#C4F4AB" stroke="#302545" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M219 132h8" stroke="#302545" stroke-width="2" stroke-linecap="round" opacity=".5"/>

  <!-- tiny tuft -->
  <path d="M176 58c2-6 6-8 10-8" fill="none" stroke="#8E5E3F" stroke-width="3" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
